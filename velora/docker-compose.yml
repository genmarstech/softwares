
services:
  bookingdb:
    image: postgres:17-alpine
    container_name: velora_db
    restart: unless-stopped

    # Values come from velora/.env (see .env.example), so no password is committed.
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - bookingdb_data:/var/lib/postgresql/data

volumes:
  bookingdb_data:
