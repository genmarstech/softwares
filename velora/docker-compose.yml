# Velora backend, production on this computer.
#
#   proddb     Postgres 17 for production. No host port: only these containers
#              reach it. Credentials are DB_NAME / DB_USER / DB_PASSWORD from
#              .env.production.
#   bookingdb  Postgres 17 for local development (`runserver`), on 127.0.0.1:5432.
#              Production never touches it.
#   migrate    runs once on every `up`, before the API starts.
#   api        gunicorn.
#   web        nginx in front: /static/, /media/ (logos), everything else to api.
#              Published on 127.0.0.1:8002 only; the host's cloudflared forwards
#              api.getvelora.co.ke there (see docs/DEPLOY.md).
#   scheduler  reminders, retries, hold expiry every minute; summaries every Monday.
#   backup     pg_dump of proddb plus a tar of the logos into ./backups every night,
#              keeping 14 days. This computer is the only copy of production, so copy
#              ./backups somewhere else too (docs/DEPLOY.md).
#
# Settings: .env (shared with local dev, holds the secrets) and then .env.production,
# which overrides it for the containers. The dev database's values in .env are read
# by Compose itself, for bookingdb.
#
# For local development, `docker compose up -d bookingdb` still starts only Postgres.

x-app: &app
  build: .
  image: velora-api
  restart: unless-stopped
  env_file:
    - path: .env
      required: true
    - path: .env.production
      required: false
  environment:
    # Inside Compose the database is proddb, whatever .env says for dev.
    DB_HOST: proddb
    DB_PORT: "5432"
    BEHIND_PROXY: "1"
  volumes:
    - prod_media:/app/media
  depends_on:
    proddb:
      condition: service_healthy

# The postgres image wants POSTGRES_*; the app's DB_* in .env.production are the one
# source, so they are mapped inside the container ($$ stops Compose reading them).
x-proddb-env: &proddb-env
  env_file:
    - path: .env.production
      required: true

services:
  proddb:
    image: postgres:17-alpine
    container_name: velora_prod_db
    restart: unless-stopped
    <<: *proddb-env
    entrypoint: ["sh", "-c", "POSTGRES_USER=$$DB_USER POSTGRES_PASSWORD=$$DB_PASSWORD POSTGRES_DB=$$DB_NAME exec docker-entrypoint.sh postgres"]
    volumes:
      - proddb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookingdb:
    image: postgres:17-alpine
    container_name: velora_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Loopback only, for `runserver` during development. It used to listen on every
    # interface, which put the bookings database on the local network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bookingdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    volumes:
      - prod_media:/app/media
      - static:/app/staticfiles

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: python manage.py run_scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VELORA_WEB_PORT:-8002}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/srv/static:ro
      - prod_media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *proddb-env
    # Runs as you, so the files in ./backups are yours to copy and delete.
    user: "1000:1000"
    environment:
      PGHOST: proddb
      TZ: Africa/Nairobi
    volumes:
      - ./backups:/backups
      - prod_media:/media:ro
    depends_on:
      proddb:
        condition: service_healthy
    # One right away, then one a day. Each dump is a full, restorable copy
    # (pg_restore, see docs/DEPLOY.md); a failed dump is reported and retried next day.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          stamp=$$(date +%Y-%m-%d_%H%M)
          if PGPASSWORD="$$DB_PASSWORD" pg_dump -U "$$DB_USER" -d "$$DB_NAME" -Fc -f "/backups/velora_$$stamp.dump.part"; then
            mv "/backups/velora_$$stamp.dump.part" "/backups/velora_$$stamp.dump"
            tar -czf "/backups/media_$$stamp.tar.gz" -C /media .
            echo "Backup $$stamp written."
          else
            rm -f "/backups/velora_$$stamp.dump.part"
            echo "Backup $$stamp FAILED." >&2
          fi
          find /backups -name 'velora_*.dump' -mtime +14 -delete
          find /backups -name 'media_*.tar.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  proddb_data:
  prod_media:
  bookingdb_data:
  static:
