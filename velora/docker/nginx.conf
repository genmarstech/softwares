# Front door for the Velora API. cloudflared (on the host) forwards
# api.getvelora.co.ke to 127.0.0.1:8002, which is this server.
#
# Everything after Cloudflare is plain HTTP, so the headers Django trusts
# (X-Forwarded-Proto, X-Forwarded-For) are SET here, never passed through from the
# client: a forwarded header a visitor could write is a way to dodge the per-IP
# throttles on sign-in and public booking.

map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    # Business logos are uploaded through the dashboard.
    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Only business logos live here, and they are shown on public booking pages.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_read_timeout 70s;
    }
}
