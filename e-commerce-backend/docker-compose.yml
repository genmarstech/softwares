services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genmars_ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-genmars_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Host side only — parameterized because this machine also runs an
      # unrelated project's Postgres container bound to the literal 5432,
      # and the two can't both publish the same host port. Set
      # POSTGRES_PORT in .env to whatever's actually free; the container
      # still listens on 5432 internally, so POSTGRES_HOST/PORT in .env
      # (read by config/settings.py) are the only other thing that needs
      # to agree with this.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genmars_ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No redis service here — this machine already runs one (see the
  # json-formatter project) on the default port. REDIS_URL in .env points at
  # it on a separate logical DB index so the two projects' keys don't mix.

volumes:
  pgdata:
